name: Check theory website
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Render LaTeX and verify the published site
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run check
          git diff --exit-code -- site/
